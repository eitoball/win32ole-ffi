name: windows

on: [push, pull_request]

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@6c0fbdd099698eeb29d84b5706dc8f8cb025498a # master
    with:
      engine: cruby
      min_version: 2.6
      versions: '["mswin", "mingw"]'

  test:
    needs: ruby-versions
    name: build (${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
        include:
          - ruby: jruby-10.1
          - ruby: jruby-10.0
          - ruby: jruby-9.4
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - name: git config
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global advice.detachedHead 0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
    - name: Set up Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run test
      run: bundle exec rake

    - id: build
      run: |
        bundle exec rake build
        echo "pkg=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT
      if: >-
        ${{
        github.event_name == 'push' &&
        (matrix.ruby == needs.ruby-versions.outputs.latest)
        }}
      shell: bash
    - name: Upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: pkg/*.gem
        name: ${{steps.build.outputs.pkg}}
      if: steps.build.outputs.pkg
